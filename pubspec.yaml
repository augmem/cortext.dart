name: cortext
description: >
  Dart FFI bindings for the Cortext memory engine — on-device long-horizon
  memory for agents and apps (text, audio, image).
version: 2.0.0
repository: https://github.com/augmem/cortext.dart
homepage: https://github.com/augmem/cortext.dart
issue_tracker: https://github.com/augmem/cortext.dart/issues
documentation: https://github.com/augmem/cortext.dart#readme
topics:
  - memory
  - embeddings
  - ffi
  - agents
  - llm

environment:
  sdk: ^3.5.0

dependencies:
  ffi: ^2.1.4
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  ffigen: ^19.0.0
  lints: ^5.0.0
  test: ^1.25.0
